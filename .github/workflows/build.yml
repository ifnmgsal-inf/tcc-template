name: Compilar PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar com latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Publicar PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: modelo-tcc
          path: main.pdf

      - name: Anexar PDF à release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: main.pdf
